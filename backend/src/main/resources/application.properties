server.port=8080

# Path to the frontend static files (relative to the backend working directory).
# Must match the actual folder — renamed design3 -> landing in 8ef18e3.
app.frontend.path=../frontend/landing/

# JWT signing secret. Must be at least 256 bits (32 chars) for HS256.
# In production, override via environment variable APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:designer-jobs-development-secret-key-please-change-me-32}
app.jwt.expiry-millis=7200000

# CORS allowed origins (comma-separated). Override via APP_CORS_ALLOWED_ORIGINS for non-dev environments.
# 8080 = Spring itself; 63342/63343 = IntelliJ built-in HTTP server; 5500 = VS Code Live Server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:63342,http://localhost:63343,http://127.0.0.1:8080,http://127.0.0.1:5500}

# Pexels "design inspiration" proxy key. Provide a (rotated) key via PEXELS_API_KEY;
# empty by default so no secret is committed. /api/design-inspiration returns 401 until set.
app.pexels.api-key=${PEXELS_API_KEY:}

# --- Logging (dev debugging) ---------------------------------------------
# Override any level via env var, e.g. APP_LOG_LEVEL=INFO for quieter output.
# Our own code — verbose by default.
logging.level.at.ac.fhcampuswien=${APP_LOG_LEVEL:DEBUG}
# HTTP request mapping / dispatch.
logging.level.org.springframework.web=DEBUG
# Spring Security filter-chain decisions (why a 401/403 happens).
logging.level.org.springframework.security=DEBUG
# JDBC / H2 layer (see the SQL that actually runs).
logging.level.org.h2=INFO

# Console + file output pattern.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n
# Also write logs to a file (gitignored via *.log / logs/).
logging.file.name=logs/app.log
