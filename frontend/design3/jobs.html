<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESIGNJOBS.COM — All Jobs</title>

  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <main>
    <section class="container-xxl px-3" style="margin-top:3rem" aria-labelledby="all-h">

      <div class="d-flex align-items-baseline gap-3 border-bottom border-2 pb-3 mb-4">
        <h2 id="all-h" class="font-monospace text-uppercase fw-bold mb-0" style="letter-spacing:.06em; font-size:2.2rem">All Jobs</h2>
        <span class="ms-auto text-success fw-bold font-monospace small" style="letter-spacing:.2em">24 listings</span>
      </div>
      <div id="jobs-container" class="row g-4">
      </div>

      <div class="text-center mt-5 mb-4">
        <button class="btn btn-outline-primary rounded-pill fw-bold text-uppercase px-5 py-2"
                type="button"
                style="letter-spacing:.16em">
          Load More
        </button>

      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    async function loadJobs() {
      const jobsContainer = document.getElementById("jobs-container");

      try {
        const response = await fetch("http://localhost:8080/jobs");

        if (!response.ok) {
          throw new Error("Could not load jobs.");
        }

        const jobs = await response.json();

        jobsContainer.innerHTML = "";

        jobs.forEach(job => {
          const card = document.createElement("div");
          card.className = "col-12";

          card.innerHTML = `
          <article class="card bg-primary text-white border-0 rounded-4">
            <div class="card-body d-flex flex-column p-4">
              <h3 class="font-monospace text-uppercase fw-bold text-white mb-3"
                  style="font-size:1.2rem; letter-spacing:.06em">
                ${job.title}
              </h3>

              <p class="card-text opacity-90 flex-grow-1">
                ${job.description}
              </p>

              <div class="d-flex gap-2 font-monospace text-uppercase mt-3 mb-2 opacity-70"
                   style="font-size:.75rem; letter-spacing:.18em">
                <span>${job.location || "Remote"}</span>
                <span>·</span>
                <span>${job.budget || "€€"}</span>
                <span>·</span>
                <span>${job.category || "Design"}</span>
              </div>

              <a href="#"
                 class="btn btn-outline-light rounded-pill btn-sm fw-bold text-uppercase align-self-end px-3"
                 style="letter-spacing:.12em">
                Read More
              </a>
            </div>
          </article>
        `;

          jobsContainer.appendChild(card);
        });

      } catch (error) {
        console.error("Error while loading jobs:", error);

        jobsContainer.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger">
            Jobs could not be loaded.
          </div>
        </div>
      `;
      }
    }

    loadJobs();
  </script>
</body>
</html>
