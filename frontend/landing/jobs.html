<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESIGNJOBS.COM — All Jobs</title>

  <script>
    document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>

<body>

<main>
  <section class="container-xxl px-3" style="margin-top:3rem" aria-labelledby="all-h">

    <div class="d-flex align-items-baseline gap-3 border-bottom border-2 pb-3 mb-4">
      <h1 id="all-h"
          class="font-monospace text-uppercase fw-bold mb-0"
          style="letter-spacing:.06em; font-size:2.2rem">
        All Jobs
      </h1>

      <span id="listings-counter"
            class="ms-auto text-success fw-bold font-monospace small"
            style="letter-spacing:.2em">
        Loading...
      </span>
    </div>

    <div class="d-flex gap-2 flex-wrap mb-4">
      <a href="homepage.html"
         class="btn btn-outline-primary rounded-pill fw-bold text-uppercase px-4"
         style="letter-spacing:.16em">
        Home
      </a>

      <a href="profile.html"
         class="btn btn-outline-primary rounded-pill fw-bold text-uppercase px-4"
         style="letter-spacing:.16em">
        Profile
      </a>

      <a href="post-a-job.html"
         class="btn btn-primary rounded-pill fw-bold text-uppercase px-4"
         style="letter-spacing:.16em">
        Post a Job
      </a>
    </div>

    <div id="jobs-container" class="row g-4">
      <div class="col-12">
        <div class="alert alert-secondary">
          Jobs are loading...
        </div>
      </div>
    </div>

    <div class="text-center mt-5 mb-4">
      <button id="load-more-button"
              class="btn btn-outline-primary rounded-pill fw-bold text-uppercase px-5 py-2"
              type="button"
              style="letter-spacing:.16em">
        Load More
      </button>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script src="common.js"></script>
<script src="jobs.js"></script>

</body>
</html>
