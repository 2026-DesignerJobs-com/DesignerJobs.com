<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — DESIGNJOBS.COM</title>

    <script>
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>

<body>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-primary border-2 rounded-4 p-2">
                    <div class="card-body p-4">

                        <p class="text-success font-monospace text-uppercase fw-bold mb-1"
                           style="font-size:.72rem; letter-spacing:.3em">
                            Welcome back
                        </p>

                        <h1 class="font-monospace text-uppercase fw-bold mb-4"
                            style="font-size:2rem; letter-spacing:.06em">
                            Login
                        </h1>

                        <form id="login-form" action="#" method="post" novalidate>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label font-monospace text-uppercase fw-bold text-secondary"
                                       for="login-email"
                                       style="font-size:.72rem; letter-spacing:.22em">
                                    Email
                                </label>

                                <input class="form-control border-primary border-2 rounded-3"
                                       type="email"
                                       id="login-email"
                                       name="email"
                                       placeholder="you@example.com"
                                       autocomplete="email"
                                       required>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label class="form-label font-monospace text-uppercase fw-bold text-secondary"
                                       for="login-password"
                                       style="font-size:.72rem; letter-spacing:.22em">
                                    Password
                                </label>

                                <input class="form-control border-primary border-2 rounded-3"
                                       type="password"
                                       id="login-password"
                                       name="password"
                                       placeholder="Enter your password"
                                       autocomplete="current-password"
                                       required>
                            </div>

                            <!-- Message area for success or error feedback -->
                            <p id="login-message"
                               class="font-monospace small mb-3"
                               aria-live="polite"></p>

                            <button type="submit"
                                    class="btn btn-primary rounded-pill w-100 fw-bold text-uppercase py-3"
                                    style="letter-spacing:.16em">
                                Login
                            </button>
                        </form>

                        <!-- Register link -->
                        <div class="d-flex align-items-center gap-3 my-4">
                            <hr class="flex-grow-1 m-0 opacity-25 border-primary">
                            <span class="font-monospace text-uppercase text-secondary"
                                  style="font-size:.72rem; letter-spacing:.3em">
                or
              </span>
                            <hr class="flex-grow-1 m-0 opacity-25 border-primary">
                        </div>

                        <p class="text-center font-monospace text-uppercase mb-0"
                           style="font-size:.72rem; letter-spacing:.18em">
                            New here?
                            <a href="register.html" class="text-primary fw-bold">
                                Create an account
                            </a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>

<script>
    // Accept only a same-origin relative path as a post-login redirect target;
    // reject javascript:/data: and off-site (//host) URLs — open-redirect/XSS (F2).
    function safeNext(raw) {
        if (!raw || raw.includes(":") || raw.startsWith("//")) return "homepage.html";
        return raw;
    }

    // If the user is already authenticated (token in localStorage, not expired),
    // skip the form and bounce straight to the homepage — closes US-04.
    if (window.Auth && Auth.isAuthenticated()) {
        const params = new URLSearchParams(window.location.search);
        window.location.replace(safeNext(params.get("next")));
    }

    // Surface a hint when we were redirected here because a token expired.
    (() => {
        const params = new URLSearchParams(window.location.search);
        const reason = params.get("reason");
        if (!reason) return;
        const message = document.getElementById("login-message");
        if (!message) return;
        if (reason === "expired") {
            message.textContent = "Your session expired. Please log in again.";
            message.className = "font-monospace small mb-3 text-warning";
        } else if (reason === "required") {
            message.textContent = "Please log in to continue.";
            message.className = "font-monospace small mb-3 text-info";
        }
    })();

    document.getElementById("login-form").addEventListener("submit", async event => {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);

        const loginData = {
            email: formData.get("email"),
            password: formData.get("password")
        };

        const message = document.getElementById("login-message");

        try {
            const response = await fetch("http://localhost:8080/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(loginData)
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent = data && data.error ? data.error : "Login failed.";
                message.className = "font-monospace small mb-3 text-danger";
                return;
            }

            // Persist the session — auth.js will keep it across reloads.
            Auth.saveSession({ token: data.token, userId: data.userId, role: data.role });

            message.textContent = "Login successful. Redirecting…";
            message.className = "font-monospace small mb-3 text-success";

            const params = new URLSearchParams(window.location.search);
            const next = safeNext(params.get("next"));

            window.parent.postMessage({
                type: "auth-changed",
                page: "profile.html"
            }, "*");
        } catch (error) {
            console.error("Login error:", error);
            message.textContent = "Login request failed. Please check if the backend is running.";
            message.className = "font-monospace small mb-3 text-danger";
        }
    });
</script>
<section class="container-xxl px-3 mt-4" aria-label="World clock">
    <div class="border border-primary border-2 rounded-4 px-4 py-3">
        <div class="d-flex flex-wrap align-items-center gap-3 font-monospace text-uppercase"
             style="letter-spacing:.16em; font-size:.72rem">

      <span class="text-primary fw-bold me-auto">
        Global Design Time
      </span>

            <div id="world-clock"
                 class="d-flex flex-wrap justify-content-end gap-4 text-secondary">
                <span>New York --:--</span>
                <span>London --:--</span>
                <span>Vienna --:--</span>
                <span>Tokyo --:--</span>
            </div>

        </div>
    </div>
</section>
<script>
    async function loadWorldClock() {
        const worldClock = document.getElementById("world-clock");

        if (!worldClock) {
            return;
        }

        try {
            const response = await fetch("http://localhost:8080/world-clock");
            const times = await response.json();

            if (!response.ok) {
                throw new Error("World clock could not be loaded.");
            }

            worldClock.innerHTML = times.map(entry => `
        <span>
          <span class="text-secondary">${entry.city}</span>
          <strong class="ms-1 text-primary">${entry.time}</strong>
        </span>
      `).join("");

        } catch (error) {
            console.error("World clock loading failed:", error);

            worldClock.innerHTML = `
        <span>New York --:--</span>
        <span>London --:--</span>
        <span>Vienna --:--</span>
        <span>Tokyo --:--</span>
      `;
        }
    }

    loadWorldClock();
</script>
</body>
</html>
